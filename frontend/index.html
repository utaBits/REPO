<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- Font Awesome latest free version -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="styles.css">
    <title>Inventory Managment</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
  </head>
  <body>
    <div class="screen">
        <header class="screenheader">
            <div class="logoname">
                <i class="fas fa-warehouse-alt" style="color: purple;"></i>
                <strong>INVENTORY</strong>
            </div>
            <input class="headerinput" placeholder="🔍 Search">
            <div class="profiledetails">
                <span><i class="fa-solid fa-bell" style="color: goldenrod;"></i></span>
                <div><i></i></div>
                <div><img/></div>
            </div>
        </header>
        <main class="maincontent">
            <aside class="asidebar">
                <nav class="sidebarmenu">
                    <a href="http://localhost:3000/dashboard" class="menuitem">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                    <a class="menuitem">
                        <i class="fa-solid fa-store"></i>
                        <span>Products</span>
                    </a>
                    <a  class="menuitem">
                        <i class="fas fa-list"></i>
                        <span>Order List</span>
                    </a>
                    <a  class="menuitem">
                        <i class="fas fa-box"></i>
                        <span>Stock</span>
                    </a>
                    <a  class="menuitem">
                        <i class="fas fa-warehouse"></i>
                        <span>Inventory</span>
                    </a>
                    <a  class="menuitem">
                        <i class="fas fa-boxes"></i>
                        <span>Product</span>
                    </a>
                </nav>
                <div class="sidebarfooter">
                    <span style="opacity: 0.6;">OTHER SECTIONS</span>
                    <a class="footeritem">
                        <i class="fas fa-file-invoice"></i>
                        <span>Invoice</span>
                    </a>
                    <a class="footeritem">
                        <i class="fa-solid fa-gear"></i>
                        <span>Settings</span>
                    </a>
                    <a class="footeritem">
                        <i class="fa-solid fa-cube"></i>
                        <span>About</span>
                    </a>
                </div>
            </aside>
            <div class="orders">
                <div class="ordersheader">
                    <strong>Dashboard</strong>
                    <div class="ordersstats">
                        <div class="stats"></div>
                        <div class="stats"></div>
                        <div class="stats"></div>
                        <div class="stats"></div>
                    </div>
                </div>
                <div class="ordersmain">
                    <div class="ordersmainheader">
                        <strong>Recent Orders</strong>
                        <div class="filters">
                            
                            <div class="filterscontent">
                                <span><i class="fa-solid fa-filter"></i></span>
                                <span>Filter By</span>
                                <select id="start_date">
                                    <option value="">Date</option>
                                </select>
                                <select id="operation_type">
                                    <option value="">Type</option>
                                </select>
                                <select id="operation_status">
                                    <option value="">Status</option>
                                </select>
                                <select id="productname">
                                    <option value="">product</option>
                                </select>
                                <input type="reset" id="reset">

                            </div>
                            <button id="addproduct">+</button>
                            <div class="modal">
                                <div class="modalcontent">
                                    <h3>Add New Product</h3>
                                    <i id="closeBtn" class="fa fa-times" aria-hidden="true"></i>
                                    <form>
                                        <label for="startDate"></label>
                                        <input type="date" id="startDate" name="startDate">
                                        <label for="productName"></label>
                                        <select id="productName" name="productName">
                                            <option value="">Select Product</option>
                                        </select>
                                        <label for="operationStatus"></label>
                                        <select id="operationStatus" name="operationStatus">
                                            <option value="">Select Operation Status</option>
                                            <option value="inProgress">In Progress</option>
                                            <option value="completed">Completed</option>
                                        </select>
                                        <label for="quantity"></label>
                                        <input type="number" id="quantity" name="quantity" placeholder="Quantity">
                                        <label for="operationType"></label>
                                        <select id="operationType" name="operationType">
                                            <option value="">Select Operation Type</option>
                                            <option value="placement">Placement</option>
                                            <option value="purchase">Purchase</option>
                                            <option value="takeFromVenue">Take from Venue</option>
                                            <option value="extraPlacement">extra placement</option>
                                            <option value="deinstall">Deinstall</option>
                                        </select>
                                        <label for="endDate"></label>
                                        <input type="date" id="endDate" name="endDate">
                                        <label for="additionalInfo"></label>
                                        <textarea id="additionalInfo" name="additionalInfo" placeholder="Additional Information"></textarea>
                                        <button type="submit">Add Product</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tablecontainer">
                    <table>
                    <thead>
                        <tr>
                           <th>NAME</th>
                           <th>TYPE</th>
                           <th>DATE</th>
                           <th>STATUS</th>
                           <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
